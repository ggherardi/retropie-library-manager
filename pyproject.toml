[project]
name = "retropie-library-manager"
version = "0.7.2"
description = "Local Windows library manager for RetroPie"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pillow>=12,<13", "paramiko>=3.5,<5", "defusedxml>=0.7,<1", "ijson>=3.3,<4", "py7zr>=1.1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx2>=2.14,<3", "types-paramiko>=4,<6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
